
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | NUK RentServe</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="container">
    <section class="form-card card" style="max-width:480px;margin:60px auto">
      <h1>Reset Password</h1>
      <p class="mute">Enter your new password below.</p>

      <form id="reset-form">
        <label>
          New password
          <input name="password" type="password" minlength="8"
                 maxlength="72" autocomplete="new-password" required>
        </label>

        <label>
          Confirm new password
          <input name="confirmPassword" type="password" minlength="8"
                 maxlength="72" autocomplete="new-password" required>
        </label>

        <p id="message" role="status" aria-live="polite"></p>
        <button class="btn btn-block" type="submit">Reset Password</button>
      </form>

      <p><a href="login.html">Back to login</a></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const email = (params.get("email") || "").trim().toLowerCase();
    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";

      const password = form.elements.password.value;
      const confirmPassword = form.elements.confirmPassword.value;

      if (!token || !email) {
        message.textContent = "The reset link is invalid. Request a new one.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      try {
        const response = await fetch(
          `${CONFIG.API_BASE}${CONFIG.ENDPOINTS.resetPassword}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, token, password })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || "Password reset failed.");
        }

        message.textContent =
          "Password reset successfully. Redirecting to login...";

        form.reset();
        window.history.replaceState({}, document.title, window.location.pathname);

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1800);
      } catch (error) {
        message.textContent =
          error.message || "Unable to connect to the backend.";
      }
    });
  </script>
</body>
</html>
