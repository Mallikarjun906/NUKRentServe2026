
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | NUK RentServe</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .reset-card {
      max-width: 480px;
      margin: 60px auto;
      padding: 28px;
    }
    .reset-card h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    .reset-card input {
      width: 100%;
      box-sizing: border-box;
    }
    .reset-message {
      margin: 12px 0;
      overflow-wrap: anywhere;
    }
    .reset-message.error { color: #b91c1c; }
    .reset-message.success { color: #166534; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">
        <span class="sun" aria-hidden="true"></span>
        NUK RentServe
      </a>
    </div>
  </header>

  <main class="container">
    <section class="reset-card form-card card">
      <h1>Forgot Password?</h1>
      <p class="mute">Enter your registered email address. If an account matches, we'll send password-reset instructions.</p>

      <form id="forgot-form">
        <label>
          Registered email
          <input name="email" type="email" required maxlength="254"
                 autocomplete="email" placeholder="you@example.com">
        </label>
        <p id="reset-message" class="reset-message" role="status" aria-live="polite"></p>
        <button id="reset-button" class="btn btn-block" type="submit">
          Send reset instructions
        </button>
      </form>

      <p class="mute" style="margin-top: 1rem">
        Remembered your password? <a href="login.html">Back to login</a>
      </p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const form = document.getElementById("forgot-form");
  const message = document.getElementById("reset-message");
  const button = document.getElementById("reset-button");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    message.textContent = "";
    message.className = "reset-message";
    button.disabled = true;

    const email = new FormData(form)
      .get("email")
      .trim()
      .toLowerCase();

    try {
      const base = CONFIG.API_BASE.replace(/\/+$/, "");

      const response = await fetch(
        `${base}${CONFIG.ENDPOINTS.forgotPassword}`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({ email })
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Unable to process your request. Please try again."
        );
      }

      message.textContent = data.message ||
        "If the email is registered, password-reset instructions will be sent.";

      message.classList.add("success");
    } catch (error) {
      message.textContent = error.message ||
        "Could not connect to the backend. Please try again later.";

      message.classList.add("error");
    } finally {
      button.disabled = false;
    }
  });
</script>

</body>
</html>
